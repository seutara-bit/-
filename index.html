<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>時間外メモ & EPOC項目</title>
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
    :root {
      --primary: #1d6feb;
      --primary-soft: #eef5ff;
      --primary-border: #b6d4fe;
      --primary-text: #0a49a6;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1f2328;
      --sub: #636c76;
      --border: #d0d7de;
      --mini-bg: #f8f9fa;
      --sub-btn-bg: #f6f8fa;
      --settings-bg: #f8fbff;
      --settings-divider: #e2ecf8;
      --divider: #eeeeee;
      --muted: #8c959f;
      --danger: #c92a2a;
      --danger-bg: #fff0f0;
      --danger-border: #ffc9c9;
      --ok: #2b8a3e;
      --ok-bg: #ebfbee;
      --ok-border: #b2f2bb;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
    }

    body[data-theme="warm"] {
      --bg: #f7f4ee;
      --card: #fffdf9;
      --text: #2b2620;
      --sub: #6e655b;
      --border: #e2dacd;
      --mini-bg: #faf7f2;
      --sub-btn-bg: #f9f5ee;
      --settings-bg: #fcfaf6;
      --settings-divider: #efe7da;
      --divider: #f0ebe2;
      --muted: #968c80;
    }

    body[data-theme="dark"] {
      --bg: #0f141b;
      --card: #18202c;
      --text: #e6edf3;
      --sub: #9aa7b8;
      --border: #2d3748;
      --mini-bg: #222c3a;
      --sub-btn-bg: #1e2836;
      --settings-bg: #151d28;
      --settings-divider: #263244;
      --divider: #253041;
      --muted: #768390;
      --danger-bg: #36191e;
      --danger-border: #6e2b35;
      --ok-bg: #163022;
      --ok-border: #275c3e;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    body[data-accent="blue"] {
      --primary: #1d6feb;
      --primary-soft: #eef5ff;
      --primary-border: #b6d4fe;
      --primary-text: #0a49a6;
    }
    body[data-theme="dark"][data-accent="blue"] {
      --primary: #3b82f6;
      --primary-soft: #1b2f4d;
      --primary-border: #2c4c7e;
      --primary-text: #93c5fd;
    }

    body[data-accent="green"] {
      --primary: #198754;
      --primary-soft: #ebfbee;
      --primary-border: #b2f2bb;
      --primary-text: #146c43;
    }
    body[data-theme="dark"][data-accent="green"] {
      --primary: #22c55e;
      --primary-soft: #163324;
      --primary-border: #24573d;
      --primary-text: #86efac;
    }

    body[data-accent="purple"] {
      --primary: #7c3aed;
      --primary-soft: #f3e8ff;
      --primary-border: #d8b4fe;
      --primary-text: #5b21b6;
    }
    body[data-theme="dark"][data-accent="purple"] {
      --primary: #a855f7;
      --primary-soft: #2b1c40;
      --primary-border: #4a2f6e;
      --primary-text: #d8b4fe;
    }

    body[data-accent="orange"] {
      --primary: #d96b14;
      --primary-soft: #fff4e6;
      --primary-border: #ffd8a8;
      --primary-text: #b35208;
    }
    body[data-theme="dark"][data-accent="orange"] {
      --primary: #fb923c;
      --primary-soft: #382414;
      --primary-border: #613c1f;
      --primary-text: #fdba74;
    }

    body[data-accent="rose"] {
      --primary: #d6336c;
      --primary-soft: #fff0f6;
      --primary-border: #fcc2d7;
      --primary-text: #a61e4d;
    }
    body[data-theme="dark"][data-accent="rose"] {
      --primary: #fb7185;
      --primary-soft: #381924;
      --primary-border: #61293c;
      --primary-text: #fda4af;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s, color 0.2s;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 10px;
      gap: 8px;
    }
    .nav-tabs {
      display: flex;
      gap: 6px;
      flex: 1;
    }
    .nav-tab {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--sub);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .header-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
    }
    .header-btn.active {
      background: var(--primary-soft);
      border-color: var(--primary-border);
      color: var(--primary-text);
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--sub);
      display: block;
      margin-bottom: 4px;
    }
    input[type="date"], input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      font-size: 1rem;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
    }
    textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.4;
      resize: vertical;
    }
    .reason-wrap {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .reason-wrap input {
      flex: 1;
    }
    .clear-x-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--mini-bg);
      color: var(--sub);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .col { flex: 1; }
    .preset-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }
    .preset-btn {
      border: 1px solid var(--primary-border);
      background: var(--primary-soft);
      color: var(--primary-text);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-align: left;
    }
    .preset-time {
      font-size: 0.75rem;
      font-weight: normal;
      opacity: 0.85;
    }
    .preset-del {
      background: #d93025;
      color: #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
    }
    .mini-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 5px;
    }
    .mini-btn {
      border: 1px solid var(--border);
      background: var(--mini-bg);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 0.76rem;
      cursor: pointer;
      color: var(--text);
    }
    .text-link-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 2px 4px;
    }
    .danger-link-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 2px 4px;
    }
    .primary-btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 4px;
    }
    .sub-save-btn {
      width: 100%;
      padding: 9px;
      font-size: 0.82rem;
      background: var(--sub-btn-bg);
      color: var(--text);
      border: 1px dashed var(--border);
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
    }
    .settings-box {
      border: 1px solid var(--primary-border);
      background: var(--settings-bg);
    }
    .settings-group {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--settings-divider);
    }
    .settings-group:last-of-type {
      border-bottom: none;
      margin-bottom: 6px;
      padding-bottom: 0;
    }
    .choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .choice-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .choice-btn.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary-text);
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
    }
    .tag-remove {
      background: none;
      border: none;
      color: var(--danger);
      font-weight: bold;
      cursor: pointer;
      padding: 0 2px;
      font-size: 0.85rem;
    }
    .add-inline {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .add-inline select, .add-inline input {
      padding: 6px 8px;
      font-size: 0.85rem;
    }
    .small-add-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .small-sec-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .memo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--divider);
      gap: 8px;
    }
    .memo-item:last-child { border-bottom: none; }
    .memo-date { font-size: 0.8rem; color: var(--sub); font-weight: 600; }
    .memo-reason { font-size: 0.95rem; margin-top: 2px; word-break: break-all; }
    .trash-item .memo-date,
    .trash-item .memo-reason {
      color: var(--muted);
    }
    .item-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .copy-btn {
      background: var(--primary-soft);
      color: var(--primary-text);
      border: 1px solid var(--primary-border);
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .restore-btn {
      background: var(--ok-bg);
      color: var(--ok);
      border: 1px solid var(--ok-border);
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .del-btn {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .trash-toggle {
      width: 100%;
      background: none;
      border: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0;
      cursor: pointer;
      color: var(--sub);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .trash-body {
      margin-top: 10px;
      border-top: 1px solid var(--divider);
      padding-top: 6px;
    }
    .empty-msg {
      font-size: 0.82rem;
      color: var(--sub);
      padding: 6px 0;
    }

    /* EPOCスタイル */
    .epoc-summary-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .epoc-total-num {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
    }
    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--mini-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.2s ease;
    }
    .cat-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .cat-pill {
      background: var(--mini-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 6px;
      text-align: center;
    }
    .cat-pill-name {
      font-size: 0.72rem;
      color: var(--sub);
      font-weight: 600;
    }
    .cat-pill-val {
      font-size: 0.88rem;
      font-weight: 800;
      margin-top: 2px;
    }
    .filter-row {
      display: flex;
      gap: 6px;
    }
    .filter-btn {
      flex: 1;
      padding: 8px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--mini-bg);
      color: var(--sub);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary-text);
    }
    .epoc-section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .epoc-section-heading {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
    }
    .epoc-section-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--mini-bg);
      color: var(--sub);
      border: 1px solid var(--border);
    }
    .epoc-section-badge.done {
      background: var(--ok-bg);
      color: var(--ok);
      border-color: var(--ok-border);
    }
    .epoc-item-card {
      margin-bottom: 7px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      overflow: hidden;
      transition: background 0.15s, border-color 0.15s;
    }
    .epoc-item-card:last-child {
      margin-bottom: 0;
    }
    .epoc-item-card.checked {
      background: var(--ok-bg);
      border-color: var(--ok-border);
    }
    .epoc-item-main {
      display: flex;
      align-items: stretch;
      min-height: 52px;
    }
    .epoc-toggle-area {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 10px 8px 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .epoc-row-left {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1;
      min-width: 0;
    }
    .epoc-num {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--sub);
      min-width: 22px;
      flex-shrink: 0;
    }
    .epoc-text-block {
      flex: 1;
      min-width: 0;
    }
    .epoc-label {
      font-size: 0.94rem;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
    }
    .epoc-item-card.checked .epoc-label {
      color: var(--ok);
    }
    .epoc-note-preview {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--primary-text);
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      border-radius: 6px;
      padding: 2px 7px;
      line-height: 1.3;
      word-break: break-all;
    }
    .epoc-status-box {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: var(--mini-bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: transparent;
      flex-shrink: 0;
    }
    .epoc-item-card.checked .epoc-status-box {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }
    .epoc-note-btn {
      border: none;
      border-left: 1px solid var(--border);
      background: transparent;
      color: var(--sub);
      padding: 0 11px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .epoc-item-card.checked .epoc-note-btn {
      border-left-color: var(--ok-border);
    }
    .epoc-note-btn.has-note {
      color: var(--primary);
    }
    .epoc-note-editor {
      padding: 8px 10px 10px;
      border-top: 1px dashed var(--border);
      background: rgba(127, 127, 127, 0.04);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .epoc-note-editor input {
      padding: 7px 9px;
      font-size: 0.88rem;
      flex: 1;
    }
    .epoc-note-clear {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--mini-bg);
      color: var(--sub);
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .epoc-note-done {
      padding: 7px 11px;
      border-radius: 7px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 24, 30, 0.92);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="nav-tabs">
      <button type="button" class="nav-tab active" id="tabOvertimeBtn">時間外メモ</button>
      <button type="button" class="nav-tab" id="tabEpocBtn">EPOC項目</button>
    </div>
    <button type="button" class="header-btn" id="toggleSettingsBtn">設定</button>
  </div>

  <!-- ユーザー別設定パネル（共通） -->
  <div class="card settings-box" id="settingsCard" style="display:none;">
    <div class="section-header">
      <label style="margin:0;color:var(--primary-text);">自分用カスタマイズ（この端末に保存）</label>
      <button type="button" class="danger-link-btn" id="resetConfigBtn">初期値に戻す</button>
    </div>

    <div class="settings-group">
      <label>テーマ</label>
      <div class="choice-row" id="themeChoices">
        <button type="button" class="choice-btn" data-theme-val="light">ライト</button>
        <button type="button" class="choice-btn" data-theme-val="warm">やわらか</button>
        <button type="button" class="choice-btn" data-theme-val="dark">ダーク</button>
      </div>

      <label style="margin-top:10px;">アクセントカラー</label>
      <div class="choice-row" id="accentChoices">
        <button type="button" class="choice-btn" data-accent-val="blue"><span class="swatch" style="background:#1d6feb;"></span>ブルー</button>
        <button type="button" class="choice-btn" data-accent-val="green"><span class="swatch" style="background:#198754;"></span>グリーン</button>
        <button type="button" class="choice-btn" data-accent-val="purple"><span class="swatch" style="background:#7c3aed;"></span>パープル</button>
        <button type="button" class="choice-btn" data-accent-val="orange"><span class="swatch" style="background:#d96b14;"></span>オレンジ</button>
        <button type="button" class="choice-btn" data-accent-val="rose"><span class="swatch" style="background:#d6336c;"></span>ローズ</button>
      </div>
    </div>

    <div class="settings-group">

  <!-- ページ1：時間外メモ -->
  <div id="overtimePage">

  <!-- ページ2：EPOC項目 -->
  <div id="epocPage" style="display:none;">
    <div class="card">
      <div class="epoc-summary-top">
        <span style="font-size:0.9rem;font-weight:700;">達成状況</span>
        <span class="epoc-total-num" id="epocTotalText">0 / 62</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="epocProgressBar" style="width:0%;"></div>
      </div>
      <div class="cat-pills">
        <div class="cat-pill">
          <div class="cat-pill-name">症候</div>
          <div class="cat-pill-val" id="epocSymText">0 / 29</div>
        </div>
        <div class="cat-pill">
          <div class="cat-pill-name">疾病・病態</div>
          <div class="cat-pill-val" id="epocDisText">0 / 26</div>
        </div>
        <div class="cat-pill">
          <div class="cat-pill-name">必須研修等</div>
          <div class="cat-pill-val" id="epocTraText">0 / 7</div>
        </div>
      </div>
      <div class="filter-row">
        <button type="button" class="filter-btn active" data-epoc-filter="all">すべて</button>
        <button type="button" class="filter-btn" data-epoc-filter="unachieved">未達成</button>
        <button type="button" class="filter-btn" data-epoc-filter="achieved">達成</button>
      </div>
    </div>

    <div id="epocSectionsContainer"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const MEMO_KEY = "ot_memos_v2";
    const TRASH_KEY = "ot_trash_v2";
    const PRESET_KEY = "ot_presets_v2";
    const CONFIG_KEY = "ot_config_v2";
    const EPOC_KEY = "ot_epoc_v1";
    const EPOC_NOTES_KEY = "ot_epoc_notes_v1";
    const MAX_TRASH = 50;

    const EPOC_DATA = [
      {
        id: "symptoms",
        title: "経験すべき症候",
        items: [
          "ショック",
          "体重減少・るい痩",
          "発疹",
          "黄疸",
          "発熱",
          "もの忘れ",
          "頭痛",
          "めまい",
          "意識障害・失神",
          "けいれん発作",
          "視力障害",
          "胸痛",
          "心停止",
          "呼吸困難",
          "吐血・喀血",
          "下血・血便",
          "嘔気・嘔吐",
          "腹痛",
          "便通異常（下痢・便秘）",
          "熱傷・外傷",
          "腰・背部痛",
          "関節痛",
          "運動麻痺・筋力低下",
          "排尿障害（尿失禁・排尿困難）",
          "興奮・せん妄",
          "抑うつ",
          "成長・発達の障害",
          "妊娠・出産",
          "終末期の症候"
        ]
      },
      {
        id: "diseases",
        title: "経験すべき疾病・病態",
        items: [
          "脳血管障害",
          "認知症",
          "急性冠症候群",
          "心不全",
          "大動脈瘤",
          "高血圧",
          "肺癌",
          "肺炎",
          "急性上気道炎",
          "気管支喘息",
          "慢性閉塞性肺疾患（COPD）",
          "急性胃腸炎",
          "胃癌",
          "消化性潰瘍",
          "肝炎・肝硬変",
          "胆石症",
          "大腸癌",
          "腎盂腎炎",
          "尿路結石",
          "腎不全",
          "高エネルギー外傷・骨折",
          "糖尿病",
          "脂質異常症",
          "うつ病",
          "統合失調症",
          "依存症（ニコチン・アルコール・薬物・病的賭博）"
        ]
      },
      {
        id: "training",
        title: "診療において必須の研修・講習・伝達講習",
        items: [
          "感染対策",
          "予防医療（予防接種を含む）",
          "虐待",
          "社会復帰支援",
          "緩和ケア",
          "ACP（アドバンス・ケア・プラニング）（終末期意思決定プロセス）",
          "CPC（臨床病理検討会）"
        ]
      }
    ];

    const DEFAULT_CONFIG = {
      theme: "light",
      accent: "blue",
      defaultStart: "17:15",
      defaultEnd: "17:45",
      startQuickTimes: ["17:15"],
      endQuickItems: [
        { type: "add", minutes: 15 },
        { type: "add", minutes: 30 }
      ]
    };

    const DEFAULT_PRESETS = [
      { id: "p1", start: "08:10", end: "08:30", reason: "朝の会" }
    ];

    const tabOvertimeBtn = document.getElementById("tabOvertimeBtn");
    const tabEpocBtn = document.getElementById("tabEpocBtn");
    const overtimePage = document.getElementById("overtimePage");
    const epocPage = document.getElementById("epocPage");

    const dateInput = document.getElementById("dateInput");
    const startSelect = document.getElementById("startSelect");
    const endSelect = document.getElementById("endSelect");
    const reasonInput = document.getElementById("reasonInput");
    const clearReasonBtn = document.getElementById("clearReasonBtn");
    const presetArea = document.getElementById("presetArea");
    const listArea = document.getElementById("listArea");
    const countSpan = document.getElementById("countSpan");
    const trashListArea = document.getElementById("trashListArea");
    const trashCountSpan = document.getElementById("trashCountSpan");
    const trashBody = document.getElementById("trashBody");
    const trashArrow = document.getElementById("trashArrow");
    const toastEl = document.getElementById("toast");

    const settingsCard = document.getElementById("settingsCard");
    const toggleSettingsBtn = document.getElementById("toggleSettingsBtn");
    const defaultStartSelect = document.getElementById("defaultStartSelect");
    const defaultEndSelect = document.getElementById("defaultEndSelect");
    const startQuickTags = document.getElementById("startQuickTags");
    const endQuickTags = document.getElementById("endQuickTags");
    const newStartQuickSelect = document.getElementById("newStartQuickSelect");
    const newEndAddInput = document.getElementById("newEndAddInput");
    const newEndTimeSelect = document.getElementById("newEndTimeSelect");
    const startQuickBtnsArea = document.getElementById("startQuickBtnsArea");
    const endQuickBtnsArea = document.getElementById("endQuickBtnsArea");

    const backupArea = document.getElementById("backupArea");
    const importFileInput = document.getElementById("importFileInput");

    const epocSectionsContainer = document.getElementById("epocSectionsContainer");
    const epocTotalText = document.getElementById("epocTotalText");
    const epocProgressBar = document.getElementById("epocProgressBar");
    const epocSymText = document.getElementById("epocSymText");
    const epocDisText = document.getElementById("epocDisText");
    const epocTraText = document.getElementById("epocTraText");

    let activePage = "overtime";
    let epocFilter = "all";
    let editingEpocKey = null;
    let isEditPreset = false;
    let isTrashOpen = false;
    let isSettingsOpen = false;

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[s]));
    }

    function switchPage(pageName) {
      activePage = pageName;
      const isEpoc = pageName === "epoc";
      overtimePage.style.display = isEpoc ? "none" : "block";
      epocPage.style.display = isEpoc ? "block" : "none";
      tabOvertimeBtn.classList.toggle("active", !isEpoc);
      tabEpocBtn.classList.toggle("active", isEpoc);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    tabOvertimeBtn.addEventListener("click", () => switchPage("overtime"));
    tabEpocBtn.addEventListener("click", () => switchPage("epoc"));

    // EPOCデータ管理
    function loadEpocMap() {
      try {
        const raw = localStorage.getItem(EPOC_KEY);
        return raw && typeof JSON.parse(raw) === "object" ? JSON.parse(raw) : {};
      } catch {
        return {};
      }
    }

    function saveEpocMap(map) {
      localStorage.setItem(EPOC_KEY, JSON.stringify(map));
    }

    function loadEpocNotes() {
      try {
        const raw = localStorage.getItem(EPOC_NOTES_KEY);
        return raw && typeof JSON.parse(raw) === "object" ? JSON.parse(raw) : {};
      } catch {
        return {};
      }
    }

    function saveEpocNotes(notes) {
      localStorage.setItem(EPOC_NOTES_KEY, JSON.stringify(notes));
    }

    function makeEpocKey(catId, index) {
      return `${catId}_${index}`;
    }

    window.toggleEpocItem = function(catId, index) {
      const key = makeEpocKey(catId, index);
      const map = loadEpocMap();
      map[key] = !map[key];
      saveEpocMap(map);
      renderEpoc();
    };

    window.toggleEpocNoteEditor = function(catId, index) {
      const key = makeEpocKey(catId, index);
      editingEpocKey = editingEpocKey === key ? null : key;
      renderEpoc();
      if (editingEpocKey) {
        const inputEl = document.getElementById(`note_input_${key}`);
        if (inputEl) inputEl.focus();
      }
    };

    window.updateEpocNote = function(catId, index, value) {
      const key = makeEpocKey(catId, index);
      const notes = loadEpocNotes();
      const trimmed = value.trim();
      if (trimmed) {
        notes[key] = trimmed;
      } else {
        delete notes[key];
      }
      saveEpocNotes(notes);
    };

    window.clearEpocNote = function(catId, index) {
      const key = makeEpocKey(catId, index);
      const notes = loadEpocNotes();
      delete notes[key];
      saveEpocNotes(notes);
      renderEpoc();
      const inputEl = document.getElementById(`note_input_${key}`);
      if (inputEl) inputEl.focus();
    };

    window.closeEpocNoteEditor = function() {
      editingEpocKey = null;
      renderEpoc();
    };

    function renderEpoc() {
      const map = loadEpocMap();
      const notes = loadEpocNotes();
      const counts = {};
      let totalDone = 0;
      let totalAll = 0;

      EPOC_DATA.forEach(cat => {
        let done = 0;
        cat.items.forEach((_, idx) => {
          totalAll += 1;
          if (map[makeEpocKey(cat.id, idx)]) {
            done += 1;
            totalDone += 1;
          }
        });
        counts[cat.id] = { done, total: cat.items.length };
      });

      const pct = totalAll > 0 ? Math.round((totalDone / totalAll) * 100) : 0;
      epocTotalText.textContent = `${totalDone} / ${totalAll}（${pct}%）`;
      epocProgressBar.style.width = `${pct}%`;

      epocSymText.textContent = `${counts.symptoms.done} / ${counts.symptoms.total}`;
      epocDisText.textContent = `${counts.diseases.done} / ${counts.diseases.total}`;
      epocTraText.textContent = `${counts.training.done} / ${counts.training.total}`;

      const sectionsHtml = EPOC_DATA.map(cat => {
        const { done, total } = counts[cat.id];
        const filteredRows = cat.items
          .map((label, idx) => {
            const key = makeEpocKey(cat.id, idx);
            return {
              label,
              idx,
              key,
              checked: Boolean(map[key]),
              note: notes[key] || ""
            };
          })
          .filter(row => {
            if (epocFilter === "achieved") return row.checked;
            if (epocFilter === "unachieved") return !row.checked;
            return true;
          });

        const rowsHtml = filteredRows.length === 0
          ? `<div class="empty-msg">該当する項目はないよ</div>`
          : filteredRows.map(row => {
              const isEditing = editingEpocKey === row.key;
              return `
                <div class="epoc-item-card ${row.checked ? "checked" : ""}">
                  <div class="epoc-item-main">
                    <button
                      type="button"
                      class="epoc-toggle-area"
                      onclick="toggleEpocItem('${cat.id}', ${row.idx})"
                      aria-pressed="${row.checked}"
                    >
                      <span class="epoc-row-left">
                        <span class="epoc-num">${row.idx + 1}</span>
                        <span class="epoc-text-block">
                          <div class="epoc-label">${escapeHtml(row.label)}</div>
                          ${row.note ? `<span class="epoc-note-preview">${escapeHtml(row.note)}</span>` : ""}
                        </span>
                      </span>
                      <span class="epoc-status-box">${row.checked ? "✓" : ""}</span>
                    </button>
                    <button
                      type="button"
                      class="epoc-note-btn ${row.note ? "has-note" : ""}"
                      onclick="toggleEpocNoteEditor('${cat.id}', ${row.idx})"
                      aria-label="メモを編集"
                    >メモ</button>
                  </div>
                  ${isEditing ? `
                    <div class="epoc-note-editor">
                      <input
                        type="text"
                        id="note_input_${row.key}"
                        value="${escapeHtml(row.note)}"
                        placeholder="例：内科で達成する、救急で経験"
                        oninput="updateEpocNote('${cat.id}', ${row.idx}, this.value)"
                        onkeydown="if(event.key==='Enter'){closeEpocNoteEditor();}"
                      />
                      <button type="button" class="epoc-note-clear" onclick="clearEpocNote('${cat.id}', ${row.idx})" title="メモを消去">×</button>
                      <button type="button" class="epoc-note-done" onclick="closeEpocNoteEditor()">完了</button>
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("");

        return `
          <div class="card">
            <div class="epoc-section-title">
              <span class="epoc-section-heading">${escapeHtml(cat.title)}</span>
              <span class="epoc-section-badge ${done === total ? "done" : ""}">${done} / ${total}</span>
            </div>
            <div>${rowsHtml}</div>
          </div>
        `;
      }).join("");

      epocSectionsContainer.innerHTML = sectionsHtml;
    }

    document.querySelectorAll("[data-epoc-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        epocFilter = btn.dataset.epocFilter;
        document.querySelectorAll("[data-epoc-filter]").forEach(b => {
          b.classList.toggle("active", b.dataset.epocFilter === epocFilter);
        });
        renderEpoc();
      });
    });

    // 設定管理
    function cloneDefaultConfig() {
      return {
        theme: DEFAULT_CONFIG.theme,
        accent: DEFAULT_CONFIG.accent,
        defaultStart: DEFAULT_CONFIG.defaultStart,
        defaultEnd: DEFAULT_CONFIG.defaultEnd,
        startQuickTimes: [...DEFAULT_CONFIG.startQuickTimes],
        endQuickItems: DEFAULT_CONFIG.endQuickItems.map(x => ({ ...x }))
      };
    }

    function loadConfig() {
      try {
        const raw = localStorage.getItem(CONFIG_KEY);
        if (!raw) return cloneDefaultConfig();
        const parsed = JSON.parse(raw);
        let endItems = Array.isArray(parsed.endQuickItems) ? parsed.endQuickItems : null;
        if (!endItems && Array.isArray(parsed.endAddMinutes)) {
          endItems = parsed.endAddMinutes.map(m => ({ type: "add", minutes: Number(m) }));
        }
        return {
          theme: parsed.theme || DEFAULT_CONFIG.theme,
          accent: parsed.accent || DEFAULT_CONFIG.accent,
          defaultStart: parsed.defaultStart || DEFAULT_CONFIG.defaultStart,
          defaultEnd: parsed.defaultEnd || DEFAULT_CONFIG.defaultEnd,
          startQuickTimes: Array.isArray(parsed.startQuickTimes) ? parsed.startQuickTimes : [...DEFAULT_CONFIG.startQuickTimes],
          endQuickItems: endItems || DEFAULT_CONFIG.endQuickItems.map(x => ({ ...x }))
        };
      } catch {
        return cloneDefaultConfig();
      }
    }

    function saveConfig(cfg) {
      localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
    }

    function applyAppearance(cfg) {
      document.body.setAttribute("data-theme", cfg.theme);
      document.body.setAttribute("data-accent", cfg.accent);

      document.querySelectorAll("[data-theme-val]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.themeVal === cfg.theme);
      });
      document.querySelectorAll("[data-accent-val]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.accentVal === cfg.accent);
      });
    }

    function initTimeSelects() {
      const options = [];
      for (let h = 0; h < 24; h++) {
        for (let m = 0; m < 60; m += 5) {
          const hh = String(h).padStart(2, "0");
          const mm = String(m).padStart(2, "0");
          options.push(`<option value="${hh}:${mm}">${hh}:${mm}</option>`);
        }
      }
      const html = options.join("");
      startSelect.innerHTML = html;
      endSelect.innerHTML = html;
      defaultStartSelect.innerHTML = html;
      defaultEndSelect.innerHTML = html;
      newStartQuickSelect.innerHTML = html;
      newEndTimeSelect.innerHTML = html;

      syncTimeSelectsWithConfig();
    }

    function syncTimeSelectsWithConfig() {
      const cfg = loadConfig();
      startSelect.value = cfg.defaultStart;
      endSelect.value = cfg.defaultEnd;
      defaultStartSelect.value = cfg.defaultStart;
      defaultEndSelect.value = cfg.defaultEnd;
      newStartQuickSelect.value = cfg.defaultStart;
      newEndTimeSelect.value = "18:00";
    }

    function formatEndItemLabel(item) {
      return item.type === "time" ? item.time : `+${item.minutes}分`;
    }

    function renderQuickControls() {
      const cfg = loadConfig();

      startQuickBtnsArea.innerHTML = "";
      cfg.startQuickTimes.forEach(t => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "mini-btn";
        b.textContent = t;
        b.addEventListener("click", () => { startSelect.value = t; });
        startQuickBtnsArea.appendChild(b);
      });
      const nowStartBtn = document.createElement("button");
      nowStartBtn.type = "button";
      nowStartBtn.className = "mini-btn";
      nowStartBtn.textContent = "今";
      nowStartBtn.addEventListener("click", () => { startSelect.value = getRoundedNow5(); });
      startQuickBtnsArea.appendChild(nowStartBtn);

      endQuickBtnsArea.innerHTML = "";
      const nowEndBtn = document.createElement("button");
      nowEndBtn.type = "button";
      nowEndBtn.className = "mini-btn";
      nowEndBtn.textContent = "今";
      nowEndBtn.addEventListener("click", () => { endSelect.value = getRoundedNow5(); });
      endQuickBtnsArea.appendChild(nowEndBtn);

      cfg.endQuickItems.forEach(item => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "mini-btn";
        b.textContent = formatEndItemLabel(item);
        b.addEventListener("click", () => {
          if (item.type === "time") {
            endSelect.value = item.time;
          } else {
            endSelect.value = addMinutesToTime(startSelect.value, item.minutes);
          }
        });
        endQuickBtnsArea.appendChild(b);
      });

      startQuickTags.innerHTML = cfg.startQuickTimes.length === 0
        ? '<span class="empty-msg">なし</span>'
        : cfg.startQuickTimes.map((t, idx) => `
            <span class="tag-chip">
              <span>${escapeHtml(t)}</span>
              <button type="button" class="tag-remove" onclick="removeStartQuick(${idx})" aria-label="削除">×</button>
            </span>
          `).join("");

      endQuickTags.innerHTML = cfg.endQuickItems.length === 0
        ? '<span class="empty-msg">なし</span>'
        : cfg.endQuickItems.map((item, idx) => `
            <span class="tag-chip">
              <span>${escapeHtml(formatEndItemLabel(item))}</span>
              <button type="button" class="tag-remove" onclick="removeEndQuick(${idx})" aria-label="削除">×</button>
            </span>
          `).join("");
    }

    window.removeStartQuick = function(idx) {
      const cfg = loadConfig();
      cfg.startQuickTimes.splice(idx, 1);
      saveConfig(cfg);
      renderQuickControls();
    };

    window.removeEndQuick = function(idx) {
      const cfg = loadConfig();
      cfg.endQuickItems.splice(idx, 1);
      saveConfig(cfg);
      renderQuickControls();
    };

    toggleSettingsBtn.addEventListener("click", () => {
      isSettingsOpen = !isSettingsOpen;
      settingsCard.style.display = isSettingsOpen ? "block" : "none";
      toggleSettingsBtn.classList.toggle("active", isSettingsOpen);
    });

    document.querySelectorAll("[data-theme-val]").forEach(btn => {
      btn.addEventListener("click", () => {
        const cfg = loadConfig();
        cfg.theme = btn.dataset.themeVal;
        saveConfig(cfg);
        applyAppearance(cfg);
        showToast("テーマを変更したよ");
      });
    });

    document.querySelectorAll("[data-accent-val]").forEach(btn => {
      btn.addEventListener("click", () => {
        const cfg = loadConfig();
        cfg.accent = btn.dataset.accentVal;
        saveConfig(cfg);
        applyAppearance(cfg);
        showToast("カラーを変更したよ");
      });
    });

    defaultStartSelect.addEventListener("change", () => {
      const cfg = loadConfig();
      cfg.defaultStart = defaultStartSelect.value;
      saveConfig(cfg);
      startSelect.value = cfg.defaultStart;
      showToast("開始の初期値を更新したよ");
    });

    defaultEndSelect.addEventListener("change", () => {
      const cfg = loadConfig();
      cfg.defaultEnd = defaultEndSelect.value;
      saveConfig(cfg);
      endSelect.value = cfg.defaultEnd;
      showToast("終了の初期値を更新したよ");
    });

    document.getElementById("addStartQuickBtn").addEventListener("click", () => {
      const val = newStartQuickSelect.value;
      const cfg = loadConfig();
      if (!cfg.startQuickTimes.includes(val)) {
        cfg.startQuickTimes.push(val);
        cfg.startQuickTimes.sort();
        saveConfig(cfg);
        renderQuickControls();
        showToast(`${val} ボタンを追加したよ`);
      }
    });

    document.getElementById("addEndAddBtn").addEventListener("click", () => {
      const min = Number(newEndAddInput.value);
      if (!min || min < 1) {
        showToast("分数を入力してね");
        newEndAddInput.focus();
        return;
      }
      const cfg = loadConfig();
      const exists = cfg.endQuickItems.some(x => x.type === "add" && x.minutes === min);
      if (!exists) {
        cfg.endQuickItems.push({ type: "add", minutes: min });
        saveConfig(cfg);
        renderQuickControls();
        newEndAddInput.value = "";
        showToast(`+${min}分 ボタンを追加したよ`);
      }
    });

    document.getElementById("addEndTimeBtn").addEventListener("click", () => {
      const t = newEndTimeSelect.value;
      const cfg = loadConfig();
      const exists = cfg.endQuickItems.some(x => x.type === "time" && x.time === t);
      if (!exists) {
        cfg.endQuickItems.push({ type: "time", time: t });
        saveConfig(cfg);
        renderQuickControls();
        showToast(`${t} ボタンを追加したよ`);
      }
    });

    document.getElementById("resetConfigBtn").addEventListener("click", () => {
      const fresh = cloneDefaultConfig();
      saveConfig(fresh);
      applyAppearance(fresh);
      syncTimeSelectsWithConfig();
      renderQuickControls();
      showToast("設定を初期値に戻したよ");
    });

    // バックアップ（書き出し・読み込み）
    function buildBackupPayload() {
      return {
        app: "overtime-memo-epoc",
        version: 3,
        exportedAt: new Date().toISOString(),
        memos: loadMemos(),
        trash: loadTrash(),
        presets: loadPresets(),
        config: loadConfig(),
        epoc: loadEpocMap(),
        epocNotes: loadEpocNotes()
      };
    }

    function applyBackupJson(rawText) {
      const data = JSON.parse(rawText);
      if (!data || typeof data !== "object") throw new Error("形式が不正");

      if (Array.isArray(data.memos)) saveMemos(data.memos);
      if (Array.isArray(data.trash)) saveTrash(data.trash);
      if (Array.isArray(data.presets)) savePresets(data.presets);
      if (data.config && typeof data.config === "object") {
        localStorage.setItem(CONFIG_KEY, JSON.stringify(data.config));
      }
      if (data.epoc && typeof data.epoc === "object") {
        saveEpocMap(data.epoc);
      }
      if (data.epocNotes && typeof data.epocNotes === "object") {
        saveEpocNotes(data.epocNotes);
      }

      const nextCfg = loadConfig();
      applyAppearance(nextCfg);
      syncTimeSelectsWithConfig();
      renderQuickControls();
      renderPresets();
      renderMemos();
      renderEpoc();
      showToast("バックアップを読み込んだよ");
    }

    document.getElementById("exportCopyBtn").addEventListener("click", async () => {
      const json = JSON.stringify(buildBackupPayload(), null, 2);
      backupArea.value = json;
      try {
        await navigator.clipboard.writeText(json);
        showToast("バックアップをコピーしたよ");
      } catch {
        backupArea.select();
        showToast("枠内に書き出したよ（手動コピーしてね）");
      }
    });

    document.getElementById("exportFileBtn").addEventListener("click", () => {
      const json = JSON.stringify(buildBackupPayload(), null, 2);
      backupArea.value = json;
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `overtime-epoc-backup-${formatDateOffset(0)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("ファイルを保存したよ");
    });

    document.getElementById("importTextBtn").addEventListener("click", () => {
      const text = backupArea.value.trim();
      if (!text) {
        showToast("先にデータを貼り付けてね");
        return;
      }
      try {
        applyBackupJson(text);
      } catch {
        showToast("読み込みに失敗したよ（形式を確認してね）");
      }
    });

    document.getElementById("importFileTriggerBtn").addEventListener("click", () => {
      importFileInput.click();
    });

    importFileInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || "");
        backupArea.value = text;
        try {
          applyBackupJson(text);
        } catch {
          showToast("ファイルの読み込みに失敗したよ");
        }
      };
      reader.readAsText(file);
      importFileInput.value = "";
    });

    clearReasonBtn.addEventListener("click", () => {
      reasonInput.value = "";
      reasonInput.focus();
    });

    function formatDateOffset(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function getRoundedNow5() {
      const d = new Date();
      let totalMin = d.getHours() * 60 + Math.round(d.getMinutes() / 5) * 5;
      if (totalMin >= 24 * 60) totalMin = 23 * 60 + 55;
      const hh = String(Math.floor(totalMin / 60)).padStart(2, "0");
      const mm = String(totalMin % 60).padStart(2, "0");
      return `${hh}:${mm}`;
    }

    function addMinutesToTime(timeStr, addMin) {
      const [h, m] = timeStr.split(":").map(Number);
      let total = (h * 60 + m + addMin) % (24 * 60);
      if (total < 0) total += 24 * 60;
      const hh = String(Math.floor(total / 60)).padStart(2, "0");
      const mm = String(total % 60).padStart(2, "0");
      return `${hh}:${mm}`;
    }

    // プリセット管理
    function loadPresets() {
      try {
        const raw = localStorage.getItem(PRESET_KEY);
        return raw ? JSON.parse(raw) : DEFAULT_PRESETS;
      } catch {
        return DEFAULT_PRESETS;
      }
    }

    function savePresets(list) {
      localStorage.setItem(PRESET_KEY, JSON.stringify(list));
    }

    function renderPresets() {
      const presets = loadPresets();
      if (presets.length === 0) {
        presetArea.innerHTML = '<span class="empty-msg">下の「マイボタンに登録」からよく使う項目を追加できるよ</span>';
        return;
      }
      presetArea.innerHTML = presets.map(p => `
        <button type="button" class="preset-btn" onclick="applyPreset('${p.id}')">
          <span>${escapeHtml(p.reason)}</span>
          <span class="preset-time">${p.start}〜${p.end}</span>
          ${isEditPreset ? `<span class="preset-del" onclick="deletePreset(event, '${p.id}')">×</span>` : ""}
        </button>
      `).join("");
    }

    window.applyPreset = function(id) {
      if (isEditPreset) return;
      const p = loadPresets().find(x => x.id === id);
      if (!p) return;
      startSelect.value = p.start;
      endSelect.value = p.end;
      reasonInput.value = p.reason;
      showToast(`「${p.reason}」をセットしたよ`);
    };

    window.deletePreset = function(e, id) {
      e.stopPropagation();
      const next = loadPresets().filter(x => x.id !== id);
      savePresets(next);
      renderPresets();
    };

    document.getElementById("toggleEditPreset").addEventListener("click", (e) => {
      isEditPreset = !isEditPreset;
      e.target.textContent = isEditPreset ? "完了" : "整理";
      renderPresets();
    });

    document.getElementById("addPresetBtn").addEventListener("click", () => {
      const reason = reasonInput.value.trim();
      if (!reason) {
        showToast("先に「理由」を入れてね");
        reasonInput.focus();
        return;
      }
      const presets = loadPresets();
      presets.push({
        id: "p_" + Date.now(),
        start: startSelect.value,
        end: endSelect.value,
        reason
      });
      savePresets(presets);
      renderPresets();
      showToast("マイボタンに登録したよ");
    });

    // メモ＆ゴミ箱管理
    function loadMemos() {
      try {
        return JSON.parse(localStorage.getItem(MEMO_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveMemos(list) {
      localStorage.setItem(MEMO_KEY, JSON.stringify(list));
    }

    function loadTrash() {
      try {
        return JSON.parse(localStorage.getItem(TRASH_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveTrash(list) {
      localStorage.setItem(TRASH_KEY, JSON.stringify(list.slice(0, MAX_TRASH)));
    }

    function formatDisplayDate(isoDate) {
      if (!isoDate) return "";
      const [y, m, d] = isoDate.split("-");
      const days = ["日", "月", "火", "水", "木", "金", "土"];
      const dow = days[new Date(Number(y), Number(m) - 1, Number(d)).getDay()];
      return `${Number(m)}/${Number(d)}(${dow})`;
    }

    function renderMemos() {
      const memos = loadMemos();
      countSpan.textContent = memos.length;
      if (memos.length === 0) {
        listArea.innerHTML = '<div class="empty-msg">メモはまだないよ</div>';
      } else {
        listArea.innerHTML = memos.map(m => `
          <div class="memo-item">
            <div>
              <div class="memo-date">${formatDisplayDate(m.date)} ${escapeHtml(m.start)}〜${escapeHtml(m.end)}</div>
              <div class="memo-reason">${escapeHtml(m.reason || "（理由なし）")}</div>
            </div>
            <div class="item-actions">
              <button type="button" class="copy-btn" onclick="copyMemo('${m.id}', 'memo')">コピー</button>
              <button type="button" class="del-btn" onclick="moveToTrash('${m.id}')">済・消去</button>
            </div>
          </div>
        `).join("");
      }
      renderTrash();
    }

    function renderTrash() {
      const trash = loadTrash();
      trashCountSpan.textContent = trash.length;
      if (trash.length === 0) {
        trashListArea.innerHTML = '<div class="empty-msg">ゴミ箱は空だよ</div>';
        return;
      }
      trashListArea.innerHTML = trash.map(m => `
        <div class="memo-item trash-item">
          <div>
            <div class="memo-date">${formatDisplayDate(m.date)} ${escapeHtml(m.start)}〜${escapeHtml(m.end)}</div>
            <div class="memo-reason">${escapeHtml(m.reason || "（理由なし）")}</div>
          </div>
          <div class="item-actions">
            <button type="button" class="copy-btn" onclick="copyMemo('${m.id}', 'trash')">コピー</button>
            <button type="button" class="restore-btn" onclick="restoreMemo('${m.id}')">戻す</button>
            <button type="button" class="del-btn" onclick="removeForever('${m.id}')">削除</button>
          </div>
        </div>
      `).join("");
    }

    window.copyMemo = function(id, source) {
      const list = source === "trash" ? loadTrash() : loadMemos();
      const m = list.find(x => x.id === id);
      if (!m) return;
      startSelect.value = m.start;
      endSelect.value = m.end;
      reasonInput.value = m.reason;
      switchPage("overtime");
      showToast("上の入力欄にコピーしたよ");
    };

    window.moveToTrash = function(id) {
      const memos = loadMemos();
      const target = memos.find(x => x.id === id);
      if (!target) return;
      saveMemos(memos.filter(x => x.id !== id));
      const trash = loadTrash();
      trash.unshift(target);
      saveTrash(trash);
      renderMemos();
      showToast("ゴミ箱へ移動したよ");
    };

    window.restoreMemo = function(id) {
      const trash = loadTrash();
      const target = trash.find(x => x.id === id);
      if (!target) return;
      saveTrash(trash.filter(x => x.id !== id));
      const memos = loadMemos();
      memos.unshift(target);
      saveMemos(memos);
      renderMemos();
      showToast("未入力メモに戻したよ");
    };

    window.removeForever = function(id) {
      const next = loadTrash().filter(x => x.id !== id);
      saveTrash(next);
      renderTrash();
    };

    document.getElementById("emptyTrashBtn").addEventListener("click", () => {
      if (loadTrash().length === 0) return;
      saveTrash([]);
      renderTrash();
      showToast("ゴミ箱を空にしたよ");
    });

    document.getElementById("toggleTrashBtn").addEventListener("click", () => {
      isTrashOpen = !isTrashOpen;
      trashBody.style.display = isTrashOpen ? "block" : "none";
      trashArrow.textContent = isTrashOpen ? "▲ 閉じる" : "▼ 開く";
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
      const memos = loadMemos();
      memos.unshift({
        id: "m_" + Date.now(),
        date: dateInput.value,
        start: startSelect.value,
        end: endSelect.value,
        reason: reasonInput.value.trim()
      });
      saveMemos(memos);
      renderMemos();
      showToast("保存したよ");
    });

    document.getElementById("todayBtn").addEventListener("click", () => {
      dateInput.value = formatDateOffset(0);
    });
    document.getElementById("yesterdayBtn").addEventListener("click", () => {
      dateInput.value = formatDateOffset(-1);
    });

    // 初期化
    const initialConfig = loadConfig();
    applyAppearance(initialConfig);
    initTimeSelects();
    renderQuickControls();
    dateInput.value = formatDateOffset(0);
    renderPresets();
    renderMemos();
    renderEpoc();
  </script>
</body>
</html>
